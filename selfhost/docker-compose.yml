# 🖥️ الموقعُ + نفقُ Cloudflare على جهازك أو خادمٍ مستأجر (selfhost/README.md).
#   docker compose -f selfhost/docker-compose.yml up -d --build
# النفقُ يوصل origin.spir-medical.com إلى الحاوية بلا فتح منافذ في الراوتر وبلا عنوانٍ ثابت،
# وبوّابةُ التبديل (edge/failover) تسأله بعد Vercel وNetlify.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # للتجربة من الجهاز نفسه فقط — الزوّارُ يصلون عبر النفق
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?ضع TUNNEL_TOKEN في selfhost/.env — من Cloudflare Zero Trust ← Networks ← Tunnels}
    restart: unless-stopped
    depends_on:
      - app
