version: 2

updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Baghdad'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # ترقياتٌ كسرت المشروع فعلاً — تُجرى يدوياً بفرعٍ وتجربة، لا بدمجٍ آليّ:
    #   • #11 (16 تشرين الأول): supabase-js 2.45→2.112 و@supabase/ssr 0.5→0.12 أسقطتا
    #     فحصَ الأنواع فتوقّف كلُّ نشرٍ على Vercel. و`ssr` في 0.x: كلُّ «minor» يكسر
    #     واجهةَ الكعكات (cookies) — يُقاس بدخولٍ حقيقيّ لا بالبناء وحده.
    #   • #14: ESLint 10 يُسقط `next lint` في Next 14.
    #   • #13: تعريفاتُ Node يجب أن تطابق إصدارَ التشغيل (engines: 24.x).
    #   • #30 (16 تشرين الأول): TypeScript 7 حذف `baseUrl` فلم تُحلّ مساراتُ `@/…` وسقط
    #     `next build` — فتوقّف النشرُ ثانيةً. و#32: eslint-config-next 16 لـNext 16.
    #     و#31: بيئةُ jsdom 30 لا تعمل مع jest 29 — تُرقّى معه لا وحدها.
    #   • #39 وَ#38 (16 تشرين الأول): zod 4 (‏`error.errors` صار `issues`) وmaplibre-gl 6
    #     أسقطا فحصَ الأنواع بـ24 خطأً. ترقيتُهما تعديلٌ للكود لا رفعُ رقم.
    ignore:
      - dependency-name: '@supabase/ssr'
      - dependency-name: '@supabase/supabase-js'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-environment-jsdom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      - dependency-name: 'maplibre-gl'
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        patterns:
          - '@supabase/*'
          - 'next'
          - 'react*'
          - 'zod'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'github-actions'
