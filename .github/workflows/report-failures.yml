name: Report failures

# رصدُ الأخطاء في لوحة الإدارة (0057): فشلُ أيّ سير عمل أو نشرٍ على Vercel يصل إلى /admin/errors،
# والنجاحُ على الفرع نفسه يُغلقه. الهويّةُ رمزُ OIDC من GitHub (لا سرَّ يُنسخ إلى Vercel).
# بياناتُ الحدث تمرّ عبر متغيّر بيئة وjq — لا تُكتب `${{ }}` من الحدث داخل أمر shell.

on:
  workflow_run:
    workflows: [CI, Security, Lighthouse Audit, Supabase Migrations, Database Backup, Scheduled Jobs]
    types: [completed]
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  report:
    name: Report to admin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send to /api/ops/ingest
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT: ${{ toJSON(github.event) }}
          INGEST_URL: ${{ vars.OPS_INGEST_URL || 'https://www.spir-medical.com/api/ops/ingest' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            BODY=$(jq -c '.workflow_run | {
              kind: "ci",
              status: (if .conclusion == "success" then "success"
                       elif (.conclusion == "failure" or .conclusion == "timed_out") then "failure"
                       else "skip" end),
              name: .name,
              branch: (.head_branch // "unknown"),
              url: .html_url,
              sha: .head_sha,
              description: ("event: " + .event + ", attempt " + (.run_attempt | tostring))
            }' <<<"$EVENT")
          else
            BODY=$(jq -c '{
              kind: "build",
              status: (if .deployment_status.state == "success" then "success"
                       elif (.deployment_status.state == "failure" or .deployment_status.state == "error") then "failure"
                       else "skip" end),
              name: ((.deployment.environment // "unknown") | split(" – ")[0] | split(" - ")[0]),
              branch: (.deployment.ref // "unknown"),
              url: (.deployment_status.target_url // .deployment_status.log_url // null),
              sha: .deployment.sha,
              description: ((.deployment_status.description // "") | .[0:500])
            } | with_entries(select(.value != null))' <<<"$EVENT")
            # Vercel يضع الإيداعَ (sha) في ref لا اسمَ الفرع — والفرعُ هو ما يجمع فشلَ النشر ونجاحَه
            REF=$(jq -r .branch <<<"$BODY")
            if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              BRANCH=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/commits/$REF/branches-where-head" | jq -r '.[0].name // empty' || true)
              BODY=$(jq -c --arg b "${BRANCH:-${REF:0:12}}" '.branch = $b' <<<"$BODY")
            fi
          fi

          if [ "$(jq -r .status <<<"$BODY")" = "skip" ]; then
            echo "Nothing to report (in progress, cancelled or skipped)."
            exit 0
          fi

          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=spir-medical-ops" | jq -r .value)
          echo "Reporting: $BODY"
          # النطاقُ أوّلاً، ثمّ Netlify مباشرةً إن لم يصل (انقطاع أو 402 — Vercel موقوفة، 28 تشرين الأول: كلُّ تقريرٍ سقط
          # بـDEPLOYMENT_DISABLED فلم يُعلَم بشيء). غيرُ ذلك يُحتسب.
          for URL in "$INGEST_URL" "https://spir-medical.netlify.app/api/ops/ingest" "https://origin.spir-medical.com/api/ops/ingest"; do
            CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' --max-time 30 -X POST "$URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "$BODY" || echo 000)
            echo "$URL → $CODE"
            if [ "$CODE" != "000" ] && [ "$CODE" != "402" ]; then break; fi
          done
          cat /tmp/resp; echo
          if [ "$CODE" = "404" ] && [ "$URL" = "$INGEST_URL" ]; then
            # النقطةُ لم تُنشر في الإنتاج بعد (قبل دمج رصد الأخطاء) — لا يُحمَّر الفحص لأجلها
            echo "::warning::/api/ops/ingest is not deployed yet (404)"
            exit 0
          fi
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]
