name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # كل اثنين الساعة 9 صباحاً UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:${{ matrix.language }}'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trufflehog
        if: github.event_name != 'schedule'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # على الدفع: من الإيداع السابق إلى الحاليّ. كان base=main وhead=HEAD فيتطابقان على main
          # («BASE and HEAD commits are the same») فيسقط الفحصُ في كلّ دمج — كشفه رصدُ الأخطاء (0057).
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event_name == 'push' && github.sha || 'HEAD' }}
          extra_args: --only-verified

      # الجدولُ الأسبوعيّ على main: base=main وhead=HEAD يتطابقان فيسقط كلَّ اثنين بلا فحص (26 تشرين الأول).
      # بلا base يفحص التاريخَ كلَّه — وهو المقصودُ من فحصٍ دوريّ.
      - name: Trufflehog (full history)
        if: github.event_name == 'schedule'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
